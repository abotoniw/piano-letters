name: Check the iPad app builds
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-check.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - run: >
          xcodebuild -project ios/PianoLetters.xcodeproj -target PianoLetters -configuration Debug
          -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build
      - name: The app contains the page and all scores
        run: |
          APP=$(find build -name PianoLetters.app -type d | head -1)
          test -f "$APP/index.html" && test -f "$APP/version.json"
          test "$(ls "$APP/data" | wc -l)" -eq "$(ls data | wc -l)"
          plutil -p "$APP/Info.plist"
      - name: Start it in an iPad simulator
        run: |
          APP=$(find build -name PianoLetters.app -type d | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k in sorted(d) if 'iOS' in k for x in d[k] if 'iPad' in x['name']][-1])")
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.abotoniw.pianoletters
          sleep 25
          xcrun simctl io "$UDID" screenshot shot.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i pianoletters
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshot, path: shot.png, if-no-files-found: ignore }
